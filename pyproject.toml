[project]
name = "epdlib"
version = "1.0.0a1"
description = "Draw layouts and show them on e-paper and other frame-buffered displays"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Ciuffo" }]
keywords = ["e-paper", "e-ink", "epd", "raspberry-pi", "waveshare", "it8951", "layout"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pillow>=13.0.0",
]

[project.optional-dependencies]
# Pin and SPI libraries for the IT8951 driver (Raspberry Pi): pip install epdlib[it8951]
it8951 = [
    "gpiod>=2.2",
    "spidev>=3.6",
]
# The same libraries for Waveshare's small screens: pip install epdlib[waveshare]
waveshare = [
    "gpiod>=2.2",
    "spidev>=3.6",
]

[project.urls]
Source = "https://github.com/txoof/epdlib"
Documentation = "https://github.com/txoof/epdlib/tree/main/docs"
Issues = "https://github.com/txoof/epdlib/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-html>=4",
    "pytest-timeout>=2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The source package (sdist) holds only what is needed to build, test and read epdlib;
# without this list it would also take in .github/, CLAUDE.md, uv.lock and stray files.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "tools", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a real display attached; run only on the Pi with `uv run pytest -m hardware`",
]
addopts = "--strict-markers -m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py311"
# Waveshare's files are copied unchanged (see the folder's UPSTREAM.txt), so not linted.
extend-exclude = ["src/epdlib/drivers/waveshare/vendor/epd*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
